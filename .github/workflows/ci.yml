name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod, not "stable": stable runs govulncheck/lint on a newer Go than the module declares.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "unformatted files:"; gofmt -l .; exit 1)
      - name: vet
        run: go vet ./...
      # Built from source with the job's Go: the prebuilt action lags the toolchain and panics on newer Go.
      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...
      - name: test
        run: go test -race ./...
